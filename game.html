<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Альфа-ландия — Игровое поле</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { overflow-x: hidden; background: #0A1628; }
    .game-layout { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 58px); }
    .sidebar { background: #fff; border-right: 1px solid var(--border); padding: 16px; overflow-y: auto; }
    .main-area { padding: 14px; overflow-y: auto; background: #0A1628; }
    #map-wrap { width: 100%; border-radius: 18px; overflow: hidden; box-shadow: 0 16px 56px rgba(0,0,0,.7), 0 4px 16px rgba(0,0,0,.4); }
    #game-map { width: 100%; display: block; }
    #info-panel { margin-top: 12px; }
    .current-div-banner {
      background: linear-gradient(135deg, #1A1A2E, #111827);
      color: #fff; border-radius: 14px; padding: 14px 18px; margin-bottom: 10px;
      display: flex; align-items: center; gap: 14px;
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 4px 20px rgba(0,0,0,.3);
    }
    .current-div-banner .big-icon { font-size: 2.2rem; flex-shrink: 0; }
    .current-div-banner h3 { font-size: 1.05rem; font-weight: 800; margin-bottom: 2px; }
    .current-div-banner p  { font-size: .78rem; opacity: .7; }
    .section-title { font-size:.88rem; font-weight:800; margin-bottom:10px; display:flex; align-items:center; gap:6px; color:var(--text); }
    .sidebar-section { margin-bottom:14px; }
    .sidebar-section h3 { font-size:.68rem; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted); margin-bottom:8px; font-weight:700; }
    @media (max-width:800px) { .game-layout { grid-template-columns:1fr; } }

    /* Daily Challenge Widget */
    .daily-widget {
      border-radius: 12px; padding: 12px 16px; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; transition: transform .15s, box-shadow .15s;
      text-decoration: none;
    }
    .daily-widget:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.25); }
    .daily-available {
      background: linear-gradient(135deg,#FF6B35,#EF3124);
      border: 1.5px solid rgba(255,255,255,.2);
      box-shadow: 0 4px 16px rgba(239,49,36,.35);
    }
    .daily-done { background: rgba(255,255,255,.07); border: 1.5px solid rgba(255,255,255,.12); }
    .dw-left { display: flex; align-items: center; gap: 10px; }
    .dw-fire { font-size: 1.8rem; }
    .dw-title { font-size: .9rem; font-weight: 800; color: #fff; }
    .dw-sub   { font-size: .78rem; color: rgba(255,255,255,.75); margin-top: 2px; }
    .btn-daily-go {
      background: rgba(255,255,255,.25); color: #fff; border: 1.5px solid rgba(255,255,255,.5);
      border-radius: 8px; padding: 6px 14px; font-size: .82rem; font-weight: 800;
      cursor: pointer; white-space: nowrap; transition: background .15s;
    }
    .btn-daily-go:hover { background: rgba(255,255,255,.4); }

    /* Scenarios Widget */
    .scenarios-widget {
      border-radius: 12px; padding: 12px 16px; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(135deg,rgba(108,61,192,.25),rgba(155,89,182,.15));
      border: 1.5px solid rgba(155,89,182,.4);
      cursor: pointer; transition: transform .15s, box-shadow .15s;
      text-decoration: none;
    }
    .scenarios-widget:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(108,61,192,.3); }
    .sw-left { display: flex; align-items: center; gap: 10px; }
    .sw-icon  { font-size: 1.8rem; }
    .sw-title { font-size: .88rem; font-weight: 800; color: #fff; }
    .sw-sub   { font-size: .76rem; color: rgba(255,255,255,.6); margin-top: 2px; }
    .btn-sc-go {
      background: rgba(155,89,182,.3); color: #fff; border: 1.5px solid rgba(155,89,182,.6);
      border-radius: 8px; padding: 5px 12px; font-size: .8rem; font-weight: 800;
      cursor: pointer; white-space: nowrap;
    }
    /* Team League Widget */
    .league-widget {
      border-radius: 12px; padding: 12px 16px; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(135deg,rgba(255,215,0,.12),rgba(255,165,0,.08));
      border: 1.5px solid rgba(255,215,0,.3);
      cursor: pointer; transition: transform .15s, box-shadow .15s;
      text-decoration: none;
    }
    .league-widget:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,215,0,.2); }
    .lw-left  { display: flex; align-items: center; gap: 10px; }
    .lw-icon  { font-size: 1.8rem; }
    .lw-title { font-size: .88rem; font-weight: 800; color: #fff; }
    .lw-sub   { font-size: .76rem; color: rgba(255,255,255,.55); margin-top: 2px; }
    .btn-lg-go {
      background: rgba(255,215,0,.2); color: #FFD700; border: 1.5px solid rgba(255,215,0,.5);
      border-radius: 8px; padding: 5px 12px; font-size: .8rem; font-weight: 800;
      cursor: pointer; white-space: nowrap;
    }

    /* ── PLAYER PAWN ── */
    #player-token {
      will-change: transform;
      transition: transform 0.82s cubic-bezier(0.34,1.56,0.64,1);
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.5));
    }
    #pawn-pulse {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: pawnPulse 2.2s ease-in-out infinite;
    }
    @keyframes pawnPulse {
      0%,100% { transform: scale(1); opacity: 0.55; }
      50%      { transform: scale(2.2); opacity: 0; }
    }
    @keyframes tokenBounce {
      0%   { transform: translateY(0); }
      30%  { transform: translateY(-22px); }
      60%  { transform: translateY(-8px); }
      80%  { transform: translateY(-3px); }
      100% { transform: translateY(0); }
    }

    /* ── INFO BUTTON ── */
    .info-btn { cursor: pointer; }
    .info-btn circle { transition: fill 0.15s; }
    .info-btn:hover circle { fill: #fff; }

    /* ── REGION MODAL ── */
    .r-modal {
      position: fixed; inset: 0; z-index: 2000;
      background: rgba(6,12,30,0.74);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.26s;
    }
    .r-modal.open { opacity: 1; pointer-events: all; }
    .r-modal-box {
      background: #fff; border-radius: 22px;
      padding: 26px 28px 28px; max-width: 460px;
      width: calc(100% - 32px); position: relative;
      box-shadow: 0 28px 80px rgba(0,0,0,0.35);
      transform: scale(0.86) translateY(28px);
      transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1);
    }
    .r-modal.open .r-modal-box { transform: scale(1) translateY(0); }
    .r-close {
      position: absolute; top: 14px; right: 14px;
      width: 30px; height: 30px; border-radius: 50%;
      border: none; background: #F2F2F6; cursor: pointer;
      font-size: 13px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
    }
    .r-close:hover { background: #E2E2EA; }
    .r-hdr  { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 12px; }
    .r-icon { font-size: 2.6rem; line-height: 1; flex-shrink: 0; }
    .r-name { font-size: 1.15rem; font-weight: 900; color: #111; line-height: 1.2; }
    .r-sub  { font-size: .78rem; color: #666; margin-top: 3px; line-height: 1.45; }
    .r-badge { display: inline-block; margin-top: 6px; padding: 2px 10px; border-radius: 20px; font-size: .72rem; font-weight: 700; }
    .r-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 0; }
    .r-cell { background: #F4F4F8; border-radius: 10px; padding: 9px 12px; }
    .r-span { grid-column: span 2; }
    .r-lbl  { font-size: .62rem; text-transform: uppercase; letter-spacing: 1px; color: #999; font-weight: 700; margin-bottom: 2px; }
    .r-val  { font-size: .82rem; font-weight: 700; color: #1A1A2E; }
    .r-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .r-chip { background: #EEF0FF; color: #3848C0; border-radius: 20px; padding: 3px 11px; font-size: .74rem; font-weight: 600; }
  </style>
</head>

// ── INIT ──
const user = requireAuth();
document.getElementById('nav-user').textContent = user.name.split(' ')[0];

function toast(msg, type='') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

// ── RENDER MAP NODES ──
function renderMap() {
  const u = getCurrentUser();
  const available = canMove(u) ? getAvailableMoves(u) : [];
  const g = document.getElementById('map-nodes');
  g.innerHTML = '';

  Object.values(DIVISIONS).forEach(div => {
    const isCurrent   = div.id === u.position;
    const isVisited   = u.visitedDivisions.includes(div.id);
    const isAvailable = available.includes(div.id);
    const isLocked    = !isVisited && !isAvailable && !isCurrent;
    const p = PRODUCTS[div.product];

    const node = document.createElementNS('http://www.w3.org/2000/svg','g');
    node.style.cursor = isAvailable ? 'pointer' : 'default';

    // Pulse ring for available
    if (isAvailable) {
      const ring = document.createElementNS('http://www.w3.org/2000/svg','circle');
      ring.setAttribute('cx', div.cx); ring.setAttribute('cy', div.cy);
      ring.setAttribute('r', '46');
      ring.setAttribute('fill', 'rgba(40,167,69,0.15)');
      ring.setAttribute('stroke', '#28A745');
      ring.setAttribute('stroke-width', '2.5');
      ring.setAttribute('stroke-dasharray', '6 4');
      ring.style.animation = 'pulse-node 1.5s ease-in-out infinite';
      node.appendChild(ring);
    }

    // Main circle (board-game style)
    const pinBg = document.createElementNS('http://www.w3.org/2000/svg','circle');
    pinBg.setAttribute('cx', div.cx); pinBg.setAttribute('cy', div.cy);
    pinBg.setAttribute('r', isCurrent ? '36' : '32');
    const bgFill = isCurrent ? '#E63946' : 'white';
    const strokeColor = isCurrent ? 'white' : isAvailable ? '#28A745' : isVisited ? p.color : 'rgba(160,160,160,0.65)';
    const strokeW = isCurrent ? '5' : isAvailable ? '4.5' : '4';
    pinBg.setAttribute('fill', bgFill);
    pinBg.setAttribute('stroke', strokeColor);
    pinBg.setAttribute('stroke-width', strokeW);
    pinBg.setAttribute('filter', 'url(#f-node)');
    if (isLocked) pinBg.setAttribute('opacity','0.62');
    node.appendChild(pinBg);

    // Division short ID (top line)
    const nameText = document.createElementNS('http://www.w3.org/2000/svg','text');
    nameText.setAttribute('x', div.cx); nameText.setAttribute('y', div.cy - 9);
    nameText.setAttribute('text-anchor','middle'); nameText.setAttribute('dominant-baseline','central');
    nameText.setAttribute('font-size', '10.5'); nameText.setAttribute('font-weight', '900');
    nameText.setAttribute('fill', isCurrent ? 'white' : isLocked ? '#AAAAAA' : '#1A1A2E');
    nameText.setAttribute('font-family', "'Space Grotesk','Plus Jakarta Sans',sans-serif");
    nameText.textContent = div.id;
    node.appendChild(nameText);

    // Product icon (bottom line)
    const icon = document.createElementNS('http://www.w3.org/2000/svg','text');
    icon.setAttribute('x', div.cx); icon.setAttribute('y', div.cy + 11);
    icon.setAttribute('text-anchor','middle'); icon.setAttribute('dominant-baseline','central');
    icon.setAttribute('font-size', '15');
    if (isLocked) icon.setAttribute('opacity','0.38');
    icon.textContent = isLocked ? '🔒' : p.icon;
    node.appendChild(icon);

    // Status badge (top-right of circle)
    if (isVisited && !isCurrent) {
      const ck = document.createElementNS('http://www.w3.org/2000/svg','circle');
      ck.setAttribute('cx', div.cx+22); ck.setAttribute('cy', div.cy-22);
      ck.setAttribute('r','11'); ck.setAttribute('fill','#28A745');
      ck.setAttribute('stroke','white'); ck.setAttribute('stroke-width','2');
      node.appendChild(ck);
      const ckTxt = document.createElementNS('http://www.w3.org/2000/svg','text');
      ckTxt.setAttribute('x', div.cx+22); ckTxt.setAttribute('y', div.cy-22);
      ckTxt.setAttribute('text-anchor','middle'); ckTxt.setAttribute('dominant-baseline','central');
      ckTxt.setAttribute('font-size','11'); ckTxt.setAttribute('fill','white'); ckTxt.setAttribute('font-weight','900');
      ckTxt.textContent = '✓';
      node.appendChild(ckTxt);
    }
    if (isAvailable) {
      const ab = document.createElementNS('http://www.w3.org/2000/svg','circle');
      ab.setAttribute('cx', div.cx+22); ab.setAttribute('cy', div.cy-22);
      ab.setAttribute('r','11'); ab.setAttribute('fill','#28A745');
      ab.setAttribute('stroke','white'); ab.setAttribute('stroke-width','2');
      node.appendChild(ab);
      const abTxt = document.createElementNS('http://www.w3.org/2000/svg','text');
      abTxt.setAttribute('x', div.cx+22); abTxt.setAttribute('y', div.cy-22);
      abTxt.setAttribute('text-anchor','middle'); abTxt.setAttribute('dominant-baseline','central');
      abTxt.setAttribute('font-size','13'); abTxt.setAttribute('fill','white'); abTxt.setAttribute('font-weight','700');
      abTxt.textContent = '→';
      node.appendChild(abTxt);
    }

    if (isAvailable) node.addEventListener('click', () => handleMove(div.id));

    // ℹ Info button (bottom-right)
    const ib = document.createElementNS('http://www.w3.org/2000/svg','g');
    ib.setAttribute('class','info-btn');
    ib.addEventListener('click', e => { e.stopPropagation(); showRegionInfo(div.id); });
    const ibBg = document.createElementNS('http://www.w3.org/2000/svg','circle');
    ibBg.setAttribute('cx', div.cx+22); ibBg.setAttribute('cy', div.cy+22);
    ibBg.setAttribute('r','11');
    ibBg.setAttribute('fill','rgba(255,255,255,0.92)');
    ibBg.setAttribute('stroke', p.color); ibBg.setAttribute('stroke-width','2');
    const ibTxt = document.createElementNS('http://www.w3.org/2000/svg','text');
    ibTxt.setAttribute('x', div.cx+22); ibTxt.setAttribute('y', div.cy+22);
    ibTxt.setAttribute('text-anchor','middle'); ibTxt.setAttribute('dominant-baseline','central');
    ibTxt.setAttribute('font-size','13'); ibTxt.setAttribute('font-weight','900');
    ibTxt.setAttribute('fill', p.color);
    ibTxt.textContent = 'i';
    ib.appendChild(ibBg); ib.appendChild(ibTxt);
    node.appendChild(ib);

    g.appendChild(node);
  });

  // ── Player pawn via CSS transform ──
  const pos = DIVISIONS[u.position];
  const tk = document.getElementById('player-token');
  tk.style.display = 'block';
  if (!tk._init) {
    tk.style.transition = 'none';
    tk.style.transform  = `translate(${pos.cx}px,${pos.cy}px)`;
    tk._init = true;
    requestAnimationFrame(() => {
      tk.style.transition = 'transform 0.82s cubic-bezier(0.34,1.56,0.64,1)';
    });
  } else {
    tk.style.transform = `translate(${pos.cx}px,${pos.cy}px)`;
  }
}

// ── SIDEBAR ──
function renderSidebar() {
  const u = getCurrentUser();
  document.getElementById('s-points').textContent  = u.points || 0;
  document.getElementById('s-level').textContent   = u.level || 1;
  const _ds = (u.daily || {}).streak || 0;
  document.getElementById('s-streak').textContent  = _ds + ' 🔥';
  document.getElementById('s-visited').textContent = u.visitedDivisions.length + '/8';

  const cycleOrder = ['MOS','NW','URAL','SIB','FAR','VOLGA','YUG','CENT'];
  const ul = document.getElementById('route-list');
  ul.innerHTML = '';
  cycleOrder.forEach(id => {
    const d = DIVISIONS[id];
    const isCurrent = id === u.position;
    const isVisited = u.visitedDivisions.includes(id);
    const passed    = u.completedQuizzes[id]?.passed;
    const li = document.createElement('li');
    li.className = isCurrent ? 'current' : (isVisited && passed ? 'done' : '');
    li.innerHTML = `<span class="tick">${isCurrent ? '📍' : (isVisited && passed ? '✓' : '·')}</span>
      <span style="font-size:.82rem">${d.name} <span style="color:var(--muted);font-size:.75rem">(${PRODUCTS[d.product].name})</span></span>`;
    ul.appendChild(li);
  });

  const bm = document.getElementById('badge-mini');
  bm.innerHTML = '';
  BADGES.forEach(b => {
    if ((u.badges||[]).includes(b.id)) {
      const s = document.createElement('span');
      s.title = b.name + ': ' + b.desc;
      s.style.cssText = 'font-size:1.3rem;cursor:default;';
      s.textContent = b.icon;
      bm.appendChild(s);
    }
  });
  if (!(u.badges||[]).length) bm.innerHTML = '<span style="font-size:.78rem;color:var(--muted)">Пройдите первый тест!</span>';
}

// ── INFO PANEL ──
function renderInfoPanel() {
  const u = getCurrentUser();
  const div = DIVISIONS[u.position];
  const p   = PRODUCTS[div.product];
  const quiz = u.completedQuizzes[u.position];
  const available = getAvailableMoves(u);
  const allDone = u.visitedDivisions.length >= 8 && Object.values(u.completedQuizzes).every(q => q.passed);

  let html = '';

  // ── DAILY CHALLENGE WIDGET ──
  const _today = new Date().toISOString().slice(0,10);
  const _daily = u.daily || {};
  const _dailyDone = _daily.lastDate === _today && _daily.todayResult !== null;
  if (!_dailyDone) {
    html += `<a href="daily.html" class="daily-widget daily-available" style="text-decoration:none">
      <div class="dw-left">
        <div class="dw-fire">⚡</div>
        <div>
          <div class="dw-title">Ежедневный вызов доступен!</div>
          <div class="dw-sub">1 вопрос · 30 секунд · <strong>+15 очков</strong></div>
        </div>
      </div>
      <button class="btn-daily-go" onclick="event.preventDefault();window.location.href='daily.html'">Играть →</button>
    </a>`;
  } else {
    html += `<a href="daily.html" class="daily-widget daily-done" style="text-decoration:none">
      <div class="dw-left">
        <div class="dw-fire">✅</div>
        <div>
          <div class="dw-title" style="color:#fff">Вызов пройден!</div>
          <div class="dw-sub">🔥 Стрик: ${_daily.streak || 0} дней · Завтра новый вопрос</div>
        </div>
      </div>
      <span style="color:rgba(255,255,255,.45);font-size:.8rem;font-weight:600">→</span>
    </a>`;
  }

  // ── SCENARIOS WIDGET ──
  html += `<a href="scenarios.html" class="scenarios-widget" style="text-decoration:none">
    <div class="sw-left">
      <div class="sw-icon">🎭</div>
      <div>
        <div class="sw-title">Клиентские сценарии</div>
        <div class="sw-sub">5 реальных ситуаций · +25 очков за каждый верный ответ</div>
      </div>
    </div>
    <button class="btn-sc-go" onclick="event.preventDefault();window.location.href='scenarios.html'">Играть →</button>
  </a>`;

  // ── LEAGUE WIDGET ──
  html += `<a href="team.html" class="league-widget" style="text-decoration:none">
    <div class="lw-left">
      <div class="lw-icon">🏆</div>
      <div>
        <div class="lw-title">Лига дивизионов</div>
        <div class="lw-sub">Командный зачёт · Ваш дивизион vs все остальные</div>
      </div>
    </div>
    <button class="btn-lg-go" onclick="event.preventDefault();window.location.href='team.html'">Таблица →</button>
  </a>`;

  // Banner
  html += `<div class="current-div-banner" style="border-left:4px solid ${div.color}">
    <div class="big-icon">${p.icon}</div>
    <div>
      <h3>${div.name}</h3>
      <p>${p.fullName} · ${p.company}</p>
      <p style="font-size:.78rem;margin-top:2px;opacity:.75">${p.description}</p>
    </div>
  </div>`;

  if (allDone) {
    html += `<div class="card" style="text-align:center;padding:28px;background:#fff">
      <div style="font-size:3.5rem">🏆</div>
      <h2 style="margin:10px 0 6px">Вся Россия пройдена!</h2>
      <p class="text-muted">Вы изучили все 5 инвестиционных продуктов Альфа-Банка, побывали в каждом из 8 дивизионов.</p>
      <div style="font-size:2rem;font-weight:900;color:var(--red);margin-top:12px">${u.points} очков</div>
      <a href="profile.html"><button class="btn btn-primary" style="margin-top:14px">Посмотреть профиль</button></a>
    </div>`;
  } else if (!quiz || !quiz.passed) {
    const role = ROLES[u.role];
    html += `<div class="card" style="background:#fff">
      <div class="section-title">📝 Тест по текущему продукту</div>
      <p style="font-size:.87rem;color:var(--muted);margin-bottom:14px">
        Пройдите тест по продукту <strong>${p.fullName}</strong>, чтобы разблокировать передвижение на карте.
      </p>
      <div class="grid-2" style="margin-bottom:14px">
        <div style="background:var(--gray);border-radius:10px;padding:12px;text-align:center">
          <div style="font-size:.7rem;color:var(--muted);font-weight:600">ВОПРОСОВ</div>
          <div style="font-size:1.4rem;font-weight:800">5</div>
        </div>
        <div style="background:var(--gray);border-radius:10px;padding:12px;text-align:center">
          <div style="font-size:.7rem;color:var(--muted);font-weight:600">УРОВЕНЬ</div>
          <div style="font-size:1.4rem;font-weight:800;color:${role.color}">${role.label}</div>
        </div>
      </div>
      ${quiz && !quiz.passed ? `<div class="warning-block mb-16" style="font-size:.85rem">Предыдущий результат: ${quiz.score}/${quiz.maxScore} — попробуйте снова!</div>` : ''}
      <a href="learn.html"><button class="btn btn-primary">📖 Изучить и пройти тест</button></a>
    </div>`;
  } else {
    html += `<div class="card" style="background:#fff">
      <span class="completed-badge">✅ Тест пройден · ${quiz.score}/${quiz.maxScore} очков</span>`;

    if (available.length === 0) {
      const unvisited = Object.keys(DIVISIONS).filter(id => !u.visitedDivisions.includes(id));
      html += unvisited.length > 0
        ? `<div class="info-block">Все соседние дивизионы уже посещены. Продолжайте путь!</div>`
        : `<div class="success-block">🎉 Все дивизионы посещены! Пройдите тесты там, где ещё не сдавали.</div>`;
    } else {
      html += `<div class="section-title" style="margin-top:6px">🗺️ Выберите следующий дивизион</div>
        <p style="font-size:.83rem;color:var(--muted);margin-bottom:10px">Нажмите на маркер карты или выберите ниже:</p>
        <div class="move-options">`;
      available.forEach(nId => {
        const nd = DIVISIONS[nId];
        const np = PRODUCTS[nd.product];
        html += `<div class="move-card" onclick="handleMove('${nId}')">
          <div style="font-size:1.5rem;margin-bottom:4px">${np.icon}</div>
          <div class="div-name">${nd.name}</div>
          <div class="product-preview">${np.fullName}</div>
          <div style="margin-top:6px">
            <span style="display:inline-block;padding:2px 10px;border-radius:20px;font-size:.75rem;font-weight:700;
              background:${nd.color}20;border:1.5px solid ${nd.color};color:${nd.color}">${np.name}</span>
          </div>
        </div>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
  }

  document.getElementById('info-panel').innerHTML = html;
}

// ── MOVE ──
function handleMove(divId) {
  let u = getCurrentUser();
  if (!canMove(u)) { toast('Сначала пройдите тест!', 'error'); return; }
  if (!getAvailableMoves(u).includes(divId)) { toast('Этот дивизион недоступен', 'error'); return; }
  u = moveTo(u, divId);
  toast('Переход в ' + DIVISIONS[divId].name + '!', 'success');
  renderAll();
}

function renderAll() { renderMap(); renderSidebar(); renderInfoPanel(); }
renderAll();
</script>
