<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Альфа-ландия — Тест</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: var(--gray); }
    .quiz-layout { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
    .quiz-top-bar {
      background: #fff; border-radius: 12px; padding: 16px 20px; margin-bottom: 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .quiz-top-bar .q-counter { font-size: .85rem; color: var(--muted); font-weight: 600; }
    .quiz-top-bar .q-score { font-size: 1rem; font-weight: 800; color: var(--red); }
    .timer { font-size: 1.1rem; font-weight: 800; color: var(--dark); }
    .timer.warning { color: var(--red); }
    .next-btn { margin-top: 16px; }
    .explanation { background: #EFF6FF; border-left: 4px solid #2196F3; border-radius: 8px; padding: 12px 16px; font-size: .9rem; margin-top: 12px; display: none; }
    .explanation.show { display: block; }
  </style>
</head>
<body>
<nav>
  <div class="logo">Альфа-<span>ландия</span></div>
  <div class="nav-links">
    <a href="game.html">← Игра</a>
    <a href="daily.html">⚡ Вызов</a>
    <a href="scenarios.html">🎭 Сценарии</a>
    <a href="profile.html">Профиль</a>
    <a href="leaderboard.html">Рейтинг</a>
    <a href="team.html">🏆 Лига</a>
  </div>
  <div class="nav-right">
    <span class="user-pill" id="nav-user">—</span>
    <button class="btn-logout" onclick="logout()">Выйти</button>
  </div>
</nav>

<div class="quiz-layout">
  <div id="quiz-screen">
    <!-- HEADER -->
    <div class="quiz-top-bar">
      <div>
        <div id="div-label" style="font-weight:700;font-size:1rem"></div>
        <div class="q-counter" id="q-counter"></div>
      </div>
      <div style="text-align:center">
        <div class="timer" id="timer">⏱ 1:30</div>
        <div style="font-size:.75rem;color:var(--muted)">на вопрос</div>
      </div>
      <div class="q-score" id="q-score">0 очков</div>
    </div>

    <!-- PROGRESS BAR -->
    <div class="progress-wrap mb-16">
      <div class="progress-bar" id="quiz-progress" style="background:var(--red);width:0%"></div>
    </div>

    <!-- QUESTION -->
    <div class="card question-card" id="question-card">
      <div id="difficulty-pill"></div>
      <div class="question-num" id="q-num"></div>
      <div class="question-text" id="q-text"></div>
      <div class="options" id="q-options"></div>
      <div class="explanation" id="explanation"></div>
      <div class="next-btn">
        <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()" style="display:none">
          Следующий вопрос →
        </button>
      </div>
    </div>
  </div>

  <!-- RESULT SCREEN (hidden initially) -->
  <div id="result-screen" class="card result-screen" style="display:none">
    <div class="result-icon" id="r-icon"></div>
    <div class="result-score" id="r-score"></div>
    <div class="result-label" id="r-label"></div>
    <div class="progress-wrap" style="max-width:300px;margin:0 auto 16px">
      <div class="progress-bar" id="r-progress" style="width:0%"></div>
    </div>
    <div id="r-details" style="margin-bottom:20px;font-size:.9rem;color:var(--muted)"></div>
    <div id="new-badges" class="new-badges"></div>
    <div style="margin-top:24px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <a href="game.html"><button class="btn btn-primary">🗺️ На карту</button></a>
      <a href="learn.html"><button class="btn btn-ghost">📖 Повторить материал</button></a>
      <button class="btn btn-ghost" onclick="retryQuiz()">🔄 Пройти тест снова</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/game.js"></script>
<script>
const user = requireAuth();
document.getElementById('nav-user').textContent = user.name.split(' ')[0];

initUserStops(user);
const currentStop = user.currentStop || 1;
const stop    = STOPS[currentStop - 1];
const div     = DIVISIONS[stop.division];
const product = PRODUCTS[stop.product];
const questions = getQuestionsForStop(currentStop);
const maxScore = calcMaxScore(questions);

let currentQ  = 0;
let score     = 0;
let answered  = false;
let timerVal  = 90;
let timerInt  = null;
let badgesBefore = [...(user.badges || [])];

document.getElementById('div-label').innerHTML = `${product.icon} Ход ${currentStop} · ${div.name} — <span style="color:var(--muted);font-weight:400">${product.fullName}</span>`;

function toast(msg, type = '') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function renderQuestion() {
  const q = questions[currentQ];
  answered = false;

  document.getElementById('q-num').textContent = `Вопрос ${currentQ + 1} из ${questions.length}`;
  document.getElementById('q-counter').textContent = `${currentQ + 1} / ${questions.length}`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('quiz-progress').style.width = ((currentQ / questions.length) * 100) + '%';
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('explanation').classList.remove('show');

  // Difficulty pill
  const pillClass = { easy: 'pill-easy', medium: 'pill-medium', hard: 'pill-hard' }[q.difficulty];
  const pillLabel = { easy: 'Базовый · ' + q.points + ' pts', medium: 'Средний · ' + q.points + ' pts', hard: 'Сложный · ' + q.points + ' pts' }[q.difficulty];
  document.getElementById('difficulty-pill').innerHTML = `<span class="difficulty-pill ${pillClass}">${pillLabel}</span>`;

  // Options
  const opts = document.getElementById('q-options');
  opts.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(i);
    opts.appendChild(btn);
  });

  startTimer();
}

function startTimer() {
  clearInterval(timerInt);
  timerVal = 90;
  updateTimerDisplay();
  timerInt = setInterval(() => {
    timerVal--;
    updateTimerDisplay();
    if (timerVal <= 0) {
      clearInterval(timerInt);
      if (!answered) timeUp();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const m = Math.floor(timerVal / 60);
  const s = timerVal % 60;
  const el = document.getElementById('timer');
  el.textContent = `⏱ ${m}:${s.toString().padStart(2,'0')}`;
  el.classList.toggle('warning', timerVal <= 15);
}

function timeUp() {
  if (answered) return;
  answered = true;
  const q = questions[currentQ];
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);
  btns[q.correct].classList.add('correct');
  toast('Время вышло!', 'error');
  document.getElementById('next-btn').style.display = '';
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  clearInterval(timerInt);
  const q = questions[currentQ];
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);
  btns[idx].classList.add(idx === q.correct ? 'correct' : 'wrong');
  if (idx !== q.correct) btns[q.correct].classList.add('correct');

  const correct = idx === q.correct;
  if (correct) {
    score += q.points;
    toast('+' + q.points + ' очков!', 'success');
  } else {
    toast('Неверно. Правильный ответ выделен.', 'error');
  }
  document.getElementById('q-score').textContent = score + ' очков';
  document.getElementById('next-btn').style.display = '';
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= questions.length) {
    showResult();
  } else {
    renderQuestion();
  }
}

function showResult() {
  clearInterval(timerInt);
  document.getElementById('quiz-progress').style.width = '100%';

  const passed   = score >= calcPassThreshold(questions);
  const pct      = Math.round((score / maxScore) * 100);

  // Save result
  let u = getCurrentUser();
  u = recordStopResult(u, currentStop, score, maxScore, passed);

  document.getElementById('quiz-screen').style.display = 'none';
  const rs = document.getElementById('result-screen');
  rs.style.display = '';

  document.getElementById('r-icon').textContent  = passed ? '🎉' : '😔';
  document.getElementById('r-score').textContent = `${score} / ${maxScore}`;
  document.getElementById('r-label').textContent = passed
    ? `Отлично! Тест пройден — вы набрали ${pct}%`
    : `Тест не пройден — нужно ${Math.ceil(60)}% (${calcPassThreshold(questions)} очков). Попробуйте снова!`;

  const pb = document.getElementById('r-progress');
  pb.style.background = passed ? 'var(--green)' : 'var(--red)';
  setTimeout(() => pb.style.width = pct + '%', 100);

  document.getElementById('r-details').innerHTML =
    `Правильных ответов: <strong>${Math.round(score / (maxScore / questions.length))}</strong> из ${questions.length} &nbsp;·&nbsp; ` +
    `Порог прохождения: <strong>${calcPassThreshold(questions)} очков (60%)</strong>`;

  // New badges
  const newBadges = (u.badges || []).filter(b => !badgesBefore.includes(b));
  if (newBadges.length) {
    const nb = document.getElementById('new-badges');
    nb.innerHTML = '<div style="font-weight:700;margin-bottom:8px">🏅 Новые значки:</div>';
    newBadges.forEach(bid => {
      const bdg = BADGES.find(b => b.id === bid);
      if (bdg) {
        nb.innerHTML += `<div class="badge earned">${bdg.icon} ${bdg.name}</div>`;
        toast(bdg.icon + ' Получен значок: ' + bdg.name, 'badge');
      }
    });
  }
}

function retryQuiz() {
  currentQ = 0; score = 0; answered = false;
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = '';
  document.getElementById('q-score').textContent = '0 очков';
  badgesBefore = [...(getCurrentUser().badges || [])];
  renderQuestion();
}

// START
renderQuestion();
</script>
</body>
</html>
