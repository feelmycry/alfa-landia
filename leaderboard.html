<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Альфа-ландия — Рейтинг</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav>
  <div class="logo">Альфа-<span>ландия</span></div>
  <div class="nav-links">
    <a href="game.html">Игра</a>
    <a href="daily.html">⚡ Вызов</a>
    <a href="scenarios.html">🎭 Сценарии</a>
    <a href="profile.html">Профиль</a>
    <a href="leaderboard.html">Рейтинг</a>
    <a href="team.html">🏆 Лига</a>
  </div>
  <div class="nav-right">
    <span class="user-pill" id="nav-user">—</span>
    <button class="btn-logout" onclick="logout()">Выйти</button>
  </div>
</nav>

<div class="lb-layout">
  <div class="page-title">🏆 Рейтинг игроков</div>

  <!-- TOP PODIUM -->
  <div id="podium" style="display:flex;gap:16px;justify-content:center;margin-bottom:24px;flex-wrap:wrap"></div>

  <!-- TABS -->
  <div class="tab-switch mb-16">
    <button class="active" onclick="switchView('global')">🌍 Общий</button>
    <button onclick="switchView('division')">🏢 Мой дивизион</button>
  </div>

  <!-- DIV FILTER (shown in division view) -->
  <div id="div-filter" style="display:none;margin-bottom:16px">
    <select id="div-select" onchange="renderTable()" style="padding:10px 14px;border-radius:10px;border:1.5px solid var(--border);font-size:.95rem;width:100%;max-width:300px">
    </select>
  </div>

  <!-- MY RANK -->
  <div id="my-rank-card" class="card mb-16" style="display:flex;align-items:center;justify-content:space-between;gap:16px">
    <div>
      <div style="font-size:.75rem;color:var(--muted);font-weight:600;text-transform:uppercase">Моё место</div>
      <div style="font-size:2rem;font-weight:900;color:var(--red)" id="my-rank">—</div>
    </div>
    <div style="text-align:center">
      <div style="font-size:.75rem;color:var(--muted);font-weight:600;text-transform:uppercase">Очки</div>
      <div style="font-size:1.5rem;font-weight:800" id="my-pts">—</div>
    </div>
    <div style="text-align:right">
      <div style="font-size:.75rem;color:var(--muted);font-weight:600;text-transform:uppercase">Дивизионов</div>
      <div style="font-size:1.5rem;font-weight:800" id="my-visited">—</div>
    </div>
  </div>

  <!-- TABLE -->
  <div class="card" style="overflow-x:auto">
    <table class="lb-table" style="min-width:500px">
      <thead>
        <tr>
          <th class="rank">#</th>
          <th>Сотрудник</th>
          <th>Дивизион</th>
          <th>Должность</th>
          <th>Очки</th>
          <th>Прогресс</th>
          <th>Значки</th>
        </tr>
      </thead>
      <tbody id="lb-body"></tbody>
    </table>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/game.js"></script>
<script>
const currentUser = requireAuth();
document.getElementById('nav-user').textContent = currentUser.name.split(' ')[0];

let viewMode = 'global';

// Fill division filter
const divSel = document.getElementById('div-select');
Object.values(DIVISIONS).forEach(d => {
  const o = document.createElement('option');
  o.value = d.id; o.textContent = d.name;
  if (d.id === currentUser.division) o.selected = true;
  divSel.appendChild(o);
});

function switchView(mode) {
  viewMode = mode;
  document.querySelectorAll('.tab-switch button').forEach((b,i) => b.classList.toggle('active', (i===0&&mode==='global')||(i===1&&mode==='division')));
  document.getElementById('div-filter').style.display = mode === 'division' ? '' : 'none';
  renderTable();
}

function rankIcon(i) {
  if (i === 0) return '<span class="rank rank-1">🥇</span>';
  if (i === 1) return '<span class="rank rank-2">🥈</span>';
  if (i === 2) return '<span class="rank rank-3">🥉</span>';
  return `<span class="rank">${i+1}</span>`;
}

function renderPodium(top3) {
  const pd = document.getElementById('podium');
  pd.innerHTML = '';
  const order = [1,0,2]; // 2nd, 1st, 3rd visual order
  order.forEach(pos => {
    const u = top3[pos];
    if (!u) return;
    const heights = [120, 150, 100];
    const medals  = ['🥈','🥇','🥉'];
    pd.innerHTML += `<div style="text-align:center;width:140px">
      <div style="font-size:2rem">${medals[pos]}</div>
      <div style="background:${pos===0?'var(--gold)':pos===1?'#E0E0E0':'#CD7F32'};
           color:#fff;border-radius:12px 12px 0 0;padding:8px;height:${heights[pos]}px;
           display:flex;flex-direction:column;justify-content:flex-end;align-items:center">
        <div style="font-size:1.5rem">👤</div>
        <div style="font-weight:800;font-size:.85rem;margin-top:4px">${u.name.split(' ')[0]}</div>
        <div style="font-size:.75rem;opacity:.8">${u.points||0} очков</div>
      </div>
    </div>`;
  });
}

function renderTable() {
  const divId = document.getElementById('div-select').value;
  let list = viewMode === 'global' ? getGlobalLeaderboard() : getDivisionLeaderboard(divId);

  // Podium
  renderPodium(list.slice(0, 3));

  // My rank
  const myIdx = list.findIndex(u => u.id === currentUser.id);
  document.getElementById('my-rank').textContent    = myIdx >= 0 ? '#' + (myIdx + 1) : '—';
  document.getElementById('my-pts').textContent     = currentUser.points || 0;
  document.getElementById('my-visited').textContent = (currentUser.visitedDivisions?.length || 0) + '/8';

  // Table
  const tbody = document.getElementById('lb-body');
  tbody.innerHTML = '';
  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:20px">Нет данных</td></tr>';
    return;
  }
  list.forEach((u, i) => {
    const isMe = u.id === currentUser.id;
    const div  = DIVISIONS[u.division];
    const role = ROLES[u.role];
    const visited = (u.visitedDivisions || []).length;
    const badgeIcons = (u.badges || []).slice(0,4).map(b => BADGES.find(x=>x.id===b)?.icon||'').join(' ');
    tbody.innerHTML += `<tr class="${isMe ? 'me' : ''}">
      <td>${rankIcon(i)}</td>
      <td style="font-weight:${isMe?'700':'400'}">${u.name} ${isMe?'(Вы)':''}</td>
      <td style="font-size:.85rem">${div?.name||u.division}</td>
      <td><span class="badge" style="background:${role?.color||'#eee'}20;border-color:${role?.color||'#ccc'};color:${role?.color||'#555'}">${role?.label||u.role}</span></td>
      <td style="font-weight:700;color:var(--red)">${u.points||0}</td>
      <td>
        <div style="display:flex;align-items:center;gap:6px">
          <span style="font-size:.85rem">${visited}/8</span>
          <div class="progress-wrap" style="flex:1;min-width:60px">
            <div class="progress-bar" style="background:var(--red);width:${visited/8*100}%"></div>
          </div>
        </div>
      </td>
      <td style="font-size:1.1rem">${badgeIcons || '—'}</td>
    </tr>`;
  });
}

renderTable();
</script>
</body>
</html>
