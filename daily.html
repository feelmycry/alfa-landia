<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Альфа-ландия — Ежедневный вызов</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #0A1628; min-height: 100vh; font-family: var(--font-body); }

    /* ── WRAPPER ── */
    .daily-wrap {
      max-width: 620px; margin: 0 auto; padding: 20px 16px 40px;
    }

    /* ── TOP META ROW ── */
    .daily-meta {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .daily-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg,#FF6B35,#EF3124);
      color: #fff; border-radius: 20px; padding: 6px 16px;
      font-weight: 800; font-size: .9rem;
      box-shadow: 0 4px 16px rgba(239,49,36,.4);
    }
    .date-label { font-size: .85rem; color: rgba(255,255,255,.5); font-weight: 600; }

    /* ── STREAK BANNER ── */
    .streak-banner {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
      border-radius: 14px; padding: 14px 20px; margin-bottom: 20px;
    }
    .streak-left { display: flex; align-items: center; gap: 12px; }
    .streak-fire { font-size: 2.2rem; }
    .streak-num  { font-size: 2rem; font-weight: 900; color: #FFD700; line-height: 1; }
    .streak-sub  { font-size: .78rem; color: rgba(255,255,255,.5); margin-top: 2px; }
    .streak-milestones { display: flex; gap: 6px; }
    .ms-dot {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .75rem; font-weight: 700;
      background: rgba(255,255,255,.08); color: rgba(255,255,255,.35);
      border: 1.5px solid rgba(255,255,255,.12);
    }
    .ms-dot.reached { background: rgba(255,215,0,.2); color: #FFD700; border-color: rgba(255,215,0,.5); }

    /* ── PRODUCT CHIP ── */
    .product-chip {
      display: flex; align-items: center; gap: 10px;
      border-radius: 12px; padding: 10px 16px; margin-bottom: 18px;
      border: 1px solid rgba(255,255,255,.1);
    }
    .product-chip .picon { font-size: 1.6rem; }
    .product-chip .pname { font-size: .85rem; font-weight: 700; color: #fff; }
    .product-chip .pco   { font-size: .75rem; color: rgba(255,255,255,.5); }
    .diff-pill {
      margin-left: auto; padding: 3px 12px; border-radius: 20px;
      font-size: .75rem; font-weight: 700; text-transform: uppercase;
    }

    /* ── TIMER ── */
    .timer-section {
      display: flex; justify-content: center; margin-bottom: 24px;
      position: relative;
    }
    .timer-svg { width: 130px; height: 130px; filter: drop-shadow(0 0 16px rgba(255,215,0,.25)); }
    .timer-bg   { fill: none; stroke: rgba(255,255,255,.08); stroke-width: 8; }
    .timer-ring { fill: none; stroke: #FFD700; stroke-width: 8; stroke-linecap: round;
                  stroke-dasharray: 339.3; stroke-dashoffset: 0;
                  transform: rotate(-90deg); transform-origin: center;
                  transition: stroke-dashoffset .95s linear, stroke .3s; }
    .timer-ring.danger { stroke: #EF3124; filter: drop-shadow(0 0 8px rgba(239,49,36,.8)); }
    .timer-num {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      font-size: 2.4rem; font-weight: 900; color: #fff; line-height: 1;
    }
    .timer-num.danger { color: #EF3124; }

    /* ── QUESTION CARD ── */
    .q-card {
      background: #fff; border-radius: 18px; padding: 24px;
      box-shadow: 0 8px 40px rgba(0,0,0,.5);
      margin-bottom: 12px;
    }
    .q-text {
      font-size: 1.1rem; font-weight: 700; color: #1A1A2E;
      line-height: 1.55; margin-bottom: 18px;
    }
    .options-grid { display: flex; flex-direction: column; gap: 10px; }
    .opt-btn {
      width: 100%; text-align: left; padding: 13px 16px;
      background: #F8F9FA; border: 2px solid #EAEAEA;
      border-radius: 10px; cursor: pointer;
      font-size: .95rem; color: #333; font-weight: 500;
      display: flex; align-items: center; gap: 12px;
      transition: all .2s; line-height: 1.4;
    }
    .opt-btn:hover:not(:disabled) { border-color: #EF3124; background: #FFF5F5; }
    .opt-btn .opt-letter {
      width: 28px; height: 28px; border-radius: 50%;
      background: #E9ECEF; display: flex; align-items: center; justify-content: center;
      font-size: .8rem; font-weight: 800; color: #666; flex-shrink: 0;
      transition: all .2s;
    }
    .opt-btn.correct { border-color: #28A745 !important; background: #F0FFF4 !important; }
    .opt-btn.correct .opt-letter { background: #28A745; color: #fff; }
    .opt-btn.wrong   { border-color: #DC3545 !important; background: #FFF5F5 !important; }
    .opt-btn.wrong .opt-letter { background: #DC3545; color: #fff; }
    .opt-btn.selected { border-color: #EF3124; background: #FFF5F5; }
    .opt-btn.selected .opt-letter { background: #EF3124; color: #fff; }
    .opt-btn:disabled { cursor: default; }

    /* ── RESULT OVERLAY ── */
    .result-card {
      border-radius: 18px; overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,.5);
      display: none;
    }
    .result-top {
      padding: 28px 24px; text-align: center; color: #fff;
    }
    .result-emoji   { font-size: 4rem; margin-bottom: 8px; }
    .result-title   { font-size: 1.5rem; font-weight: 900; margin-bottom: 4px; }
    .result-sub     { font-size: .9rem; opacity: .8; }
    .result-body    { background: #fff; padding: 20px 24px; }
    .points-row {
      display: flex; gap: 12px; margin-bottom: 16px;
    }
    .pts-box {
      flex: 1; background: #F8F9FA; border-radius: 12px; padding: 14px;
      text-align: center; border: 1.5px solid #EAEAEA;
    }
    .pts-box .pb-val { font-size: 1.6rem; font-weight: 900; color: #EF3124; }
    .pts-box .pb-lbl { font-size: .75rem; color: #888; font-weight: 600; text-transform: uppercase; }
    .correct-answer-box {
      background: #F0FFF4; border-left: 4px solid #28A745;
      border-radius: 8px; padding: 12px 14px; font-size: .88rem;
      color: #333; line-height: 1.5; margin-bottom: 16px;
    }
    .next-time {
      background: #1A1A2E; color: rgba(255,255,255,.7);
      border-radius: 12px; padding: 14px; text-align: center; margin-bottom: 16px;
    }
    .next-time .countdown-label { font-size: .78rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .next-time .countdown-time  { font-size: 1.4rem; font-weight: 900; color: #FFD700; letter-spacing: 2px; }
    .result-actions { display: flex; gap: 10px; }
    .result-actions a, .result-actions button { flex: 1; }

    /* ── ALREADY DONE SCREEN ── */
    .done-card {
      background: #fff; border-radius: 18px; padding: 32px 24px;
      box-shadow: 0 8px 40px rgba(0,0,0,.5); text-align: center;
      display: none;
    }
    .done-icon    { font-size: 4rem; margin-bottom: 12px; }
    .done-title   { font-size: 1.3rem; font-weight: 900; color: #1A1A2E; margin-bottom: 6px; }
    .done-sub     { font-size: .9rem; color: #888; margin-bottom: 20px; }
    .done-stats   { display: flex; gap: 12px; margin-bottom: 20px; }
    .done-stat    { flex:1; background:#F8F9FA; border-radius:12px; padding:14px; text-align:center; }
    .done-stat .dv { font-size:1.5rem; font-weight:900; color:var(--red); }
    .done-stat .dl { font-size:.75rem; color:#888; font-weight:600; text-transform:uppercase; }

    /* ── ANIMATIONS ── */
    @keyframes fadeIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    .fade-in { animation: fadeIn .4s ease; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
    .shake { animation: shake .35s ease; }
    @keyframes ping {
      0%   { transform: scale(1); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .ping::after {
      content:''; position:absolute; inset:0; border-radius:inherit;
      border:2px solid #FFD700; animation: ping 1s ease-out infinite;
    }

    /* ── CONFETTI CANVAS ── */
    #confetti-canvas {
      position: fixed; top:0; left:0; width:100%; height:100%;
      pointer-events: none; z-index: 9999; display: none;
    }
  </style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>
<nav>
  <div class="logo">Альфа-<span>ландия</span></div>
  <div class="nav-links">
    <a href="game.html">← Карта</a>
    <a href="profile.html">Профиль</a>
    <a href="leaderboard.html">Рейтинг</a>
  </div>
  <div class="nav-right">
    <span class="user-pill" id="nav-user">—</span>
    <button class="btn-logout" onclick="logout()">Выйти</button>
  </div>
</nav>

<div class="daily-wrap">

  <!-- Meta row -->
  <div class="daily-meta">
    <div class="daily-badge">⚡ Ежедневный вызов</div>
    <div class="date-label" id="date-label"></div>
  </div>

  <!-- Streak banner -->
  <div class="streak-banner">
    <div class="streak-left">
      <div class="streak-fire">🔥</div>
      <div>
        <div class="streak-num" id="streak-num">0</div>
        <div class="streak-sub">дней подряд</div>
      </div>
    </div>
    <div class="streak-milestones" id="milestones"></div>
  </div>

  <!-- ── CHALLENGE SCREEN ── -->
  <div id="challenge-screen">
    <!-- Product chip -->
    <div class="product-chip" id="product-chip">
      <div class="picon" id="chip-icon"></div>
      <div><div class="pname" id="chip-name"></div><div class="pco" id="chip-co"></div></div>
      <div class="diff-pill" id="chip-diff"></div>
    </div>

    <!-- Timer -->
    <div class="timer-section">
      <svg class="timer-svg" viewBox="0 0 120 120">
        <circle class="timer-bg" cx="60" cy="60" r="54"/>
        <circle class="timer-ring" id="timer-ring" cx="60" cy="60" r="54"/>
      </svg>
      <div class="timer-num" id="timer-num">30</div>
    </div>

    <!-- Question card -->
    <div class="q-card fade-in">
      <div class="q-text" id="q-text"></div>
      <div class="options-grid" id="options"></div>
    </div>
  </div>

  <!-- ── RESULT SCREEN ── -->
  <div class="result-card fade-in" id="result-card">
    <div class="result-top" id="result-top">
      <div class="result-emoji" id="res-emoji"></div>
      <div class="result-title" id="res-title"></div>
      <div class="result-sub"   id="res-sub"></div>
    </div>
    <div class="result-body">
      <div class="points-row">
        <div class="pts-box"><div class="pb-val" id="pts-earned">+0</div><div class="pb-lbl">Очков сегодня</div></div>
        <div class="pts-box"><div class="pb-val" id="streak-after" style="color:#FF9800">0 🔥</div><div class="pb-lbl">Стрик</div></div>
        <div class="pts-box"><div class="pb-val" id="total-pts">0</div><div class="pb-lbl">Всего очков</div></div>
      </div>
      <div class="correct-answer-box" id="correct-box" style="display:none"></div>
      <div class="next-time">
        <div class="countdown-label">Следующий вызов через</div>
        <div class="countdown-time" id="next-countdown">00:00:00</div>
      </div>
      <div class="result-actions">
        <a href="game.html"><button class="btn btn-primary" style="width:100%">🗺️ На карту</button></a>
        <a href="learn.html"><button class="btn btn-ghost" style="width:100%">📖 Учиться</button></a>
      </div>
    </div>
  </div>

  <!-- ── ALREADY DONE SCREEN ── -->
  <div class="done-card fade-in" id="done-card">
    <div class="done-icon">✅</div>
    <div class="done-title">Сегодняшний вызов пройден!</div>
    <div class="done-sub" id="done-sub">Приходите завтра за новым вопросом</div>
    <div class="done-stats">
      <div class="done-stat"><div class="dv" id="done-streak">0 🔥</div><div class="dl">Стрик</div></div>
      <div class="done-stat"><div class="dv" id="done-pts">0</div><div class="dl">Очков всего</div></div>
      <div class="done-stat"><div class="dv" id="done-total-done">0</div><div class="dl">Вызовов принято</div></div>
    </div>
    <div class="next-time" style="margin-bottom:16px">
      <div class="countdown-label">Следующий вызов через</div>
      <div class="countdown-time" id="done-countdown">00:00:00</div>
    </div>
    <a href="game.html"><button class="btn btn-primary" style="width:100%">🗺️ На карту</button></a>
  </div>

</div><!-- /daily-wrap -->

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/game.js"></script>
<script>
// ── INIT ──
const user = requireAuth();
document.getElementById('nav-user').textContent = user.name.split(' ')[0];

const today   = new Date().toISOString().slice(0,10);
const todayRu = new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
document.getElementById('date-label').textContent = todayRu.charAt(0).toUpperCase() + todayRu.slice(1);

// ── STREAK CONSTANTS ──
const MILESTONES = [
  { days: 3,  icon: '🥉', label: '3 дня' },
  { days: 7,  icon: '🥈', label: '7 дней' },
  { days: 14, icon: '🥇', label: '2 нед.' },
  { days: 30, icon: '💎', label: 'Месяц' }
];

// ── GET DAILY QUESTION (date-seeded, same for all users) ──
function getDailyQuestion() {
  const pool = [];
  Object.entries(QUESTIONS).forEach(([pid, levels]) => {
    Object.entries(levels).forEach(([diff, qs]) => {
      qs.forEach(q => pool.push({ ...q, productId: pid, difficulty: diff }));
    });
  });
  const seed = today.replace(/-/g,'').split('').reduce((a,c) => a * 31 + c.charCodeAt(0), 1);
  return pool[Math.abs(seed) % pool.length];
}

// ── DAILY STATE ──
function getDailyState(u) {
  return u.daily || { streak: 0, lastDate: null, totalDone: 0, todayResult: null };
}
// ── RENDER STREAK BANNER ──
function renderStreak(streakVal) {
  document.getElementById('streak-num').textContent = streakVal;
  const ms = document.getElementById('milestones');
  ms.innerHTML = '';
  MILESTONES.forEach(m => {
    const el = document.createElement('div');
    el.className = 'ms-dot ' + (streakVal >= m.days ? 'reached' : '');
    el.title = m.label;
    el.textContent = streakVal >= m.days ? m.icon : m.days;
    ms.appendChild(el);
  });
}

// ── COUNTDOWN TO MIDNIGHT ──
function getTimeToMidnight() {
  const now = new Date();
  const midnight = new Date(now);
  midnight.setHours(24,0,0,0);
  const diff = midnight - now;
  const h = String(Math.floor(diff/3600000)).padStart(2,'0');
  const m = String(Math.floor((diff%3600000)/60000)).padStart(2,'0');
  const s = String(Math.floor((diff%60000)/1000)).padStart(2,'0');
  return `${h}:${m}:${s}`;
}
function startCountdown(ids) {
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.textContent = getTimeToMidnight();
  });
  setInterval(() => {
    ids.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.textContent = getTimeToMidnight();
    });
  }, 1000);
}

// ── SHOW ALREADY DONE SCREEN ──
function showAlreadyDone(state) {
  document.getElementById('challenge-screen').style.display = 'none';
  const u = getCurrentUser();
  const wasCorrect = state.todayResult?.correct;
  document.getElementById('done-card').style.display = '';
  document.getElementById('done-streak').textContent  = state.streak + ' 🔥';
  document.getElementById('done-pts').textContent     = u.points || 0;
  document.getElementById('done-total-done').textContent = state.totalDone || 0;
  document.getElementById('done-sub').textContent =
    wasCorrect ? '🎉 Сегодня вы ответили правильно!' : '❌ Сегодня ответ был неверным — завтра новый шанс!';
  startCountdown(['done-countdown']);
  renderStreak(state.streak);
}

// ── MAIN GAME LOGIC ──
const q     = getDailyQuestion();
const prod  = PRODUCTS[q.productId];
let state   = getDailyState(getCurrentUser());

// Refresh today result if it was on a different date
if (state.lastDate !== today) {
  state.todayResult = null;
}

renderStreak(state.streak);

// Check if already done today
if (state.todayResult !== null) {
  showAlreadyDone(state);
} else {
  // Show challenge
  const diffMap = { easy: 'Базовый · 10 pts', medium: 'Средний · 20 pts', hard: 'Сложный · 30 pts' };
  const diffCol  = { easy: '#28A745', medium: '#FF9800', hard: '#DC3545' };

  document.getElementById('chip-icon').textContent  = prod.icon;
  document.getElementById('chip-name').textContent  = prod.fullName;
  document.getElementById('chip-co').textContent    = prod.company;
  document.getElementById('q-text').textContent     = q.q;
  const dp = document.getElementById('chip-diff');
  dp.textContent = diffMap[q.difficulty];
  dp.style.cssText = `background:${diffCol[q.difficulty]}20;color:${diffCol[q.difficulty]};border:1.5px solid ${diffCol[q.difficulty]}60;border-radius:20px;padding:3px 12px;font-size:.75rem;font-weight:700`;
  // Color the product chip
  document.getElementById('product-chip').style.background = prod.color + '18';
  document.getElementById('product-chip').style.borderColor = prod.color + '50';

  // Render options
  const optCont = document.getElementById('options');
  const letters = ['А','Б','В','Г'];
  let answered = false;
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `<span class="opt-letter">${letters[i]}</span> <span>${opt}</span>`;
    btn.onclick = () => { if (!answered) selectAnswer(i); };
    optCont.appendChild(btn);
  });

  // ── TIMER ──
  let timeLeft = 30;
  const CIRCUMFERENCE = 339.3;
  const ring    = document.getElementById('timer-ring');
  const numEl   = document.getElementById('timer-num');
  let timerInt  = null;

  function updateTimer() {
    const ratio    = timeLeft / 30;
    const offset   = CIRCUMFERENCE * (1 - ratio);
    ring.style.strokeDashoffset = offset;
    numEl.textContent = timeLeft;
    if (timeLeft <= 10) {
      ring.classList.add('danger');
      numEl.classList.add('danger');
    }
    if (timeLeft <= 0) {
      clearInterval(timerInt);
      timeUp();
    }
    timeLeft--;
  }

  updateTimer();
  timerInt = setInterval(updateTimer, 1000);

  // ── ANSWER SELECTION ──
  function selectAnswer(idx) {
    answered = true;
    clearInterval(timerInt);
    const correct = idx === q.correct;
    const btns    = optCont.querySelectorAll('.opt-btn');
    btns.forEach(b => b.disabled = true);
    btns[idx].classList.add(correct ? 'correct' : 'wrong');
    if (!correct) btns[q.correct].classList.add('correct');
    if (correct) btns[idx].classList.add('selected');

    setTimeout(() => showResult(correct, idx), 700);
  }

  function timeUp() {
    answered = true;
    const btns = optCont.querySelectorAll('.opt-btn');
    btns.forEach(b => b.disabled = true);
    btns[q.correct].classList.add('correct');
    setTimeout(() => showResult(false, -1, true), 600);
  }

  // ── SHOW RESULT ──
  function showResult(correct, selectedIdx, timeout = false) {
    // Calc points
    const basePoints = q.points || (q.difficulty === 'hard' ? 30 : q.difficulty === 'medium' ? 20 : 10);
    let streakBonus  = 0;
    let newStreak    = correct ? state.streak + 1 : 0;
    if (correct) {
      if (newStreak >= 30) streakBonus = 25;
      else if (newStreak >= 14) streakBonus = 15;
      else if (newStreak >= 7)  streakBonus = 10;
      else if (newStreak >= 3)  streakBonus = 5;
    }
    const ptsEarned = correct ? basePoints + streakBonus : 0;

    // Save state
    state.streak    = correct ? newStreak : 0;
    state.lastDate  = today;
    state.totalDone = (state.totalDone || 0) + 1;
    state.todayResult = { correct, pts: ptsEarned };
    let u = getCurrentUser();
    u.daily = state;
    if (ptsEarned > 0) {
      u.points = (u.points || 0) + ptsEarned;
      u.xp     = (u.xp || 0) + ptsEarned;
      u.level  = Math.floor(u.xp / 200) + 1;
    }
    // Badge checks
    if (state.streak >= 3)  { if (!u.badges.includes('streak_3')) u.badges.push('streak_3'); }
    if (state.streak >= 7)  { if (!u.badges.includes('streak_7')) u.badges.push('streak_7'); }
    saveUser(u);

    // Confetti on correct
    if (correct) setTimeout(launchConfetti, 200);

    // Render result card
    document.getElementById('challenge-screen').style.display = 'none';
    const rc = document.getElementById('result-card');
    rc.style.display = '';

    const topEl = document.getElementById('result-top');
    if (correct) {
      topEl.style.background = 'linear-gradient(135deg,#28A745,#1E8449)';
      document.getElementById('res-emoji').textContent = '🎉';
      document.getElementById('res-title').textContent = 'Правильно!';
      document.getElementById('res-sub').textContent   = streakBonus > 0 ? `+${streakBonus} бонус за стрик ${newStreak} дней` : 'Отличная работа!';
    } else if (timeout) {
      topEl.style.background = 'linear-gradient(135deg,#6C757D,#495057)';
      document.getElementById('res-emoji').textContent = '⏱';
      document.getElementById('res-title').textContent = 'Время вышло!';
      document.getElementById('res-sub').textContent   = 'Стрик прерван · Завтра новый шанс';
    } else {
      topEl.style.background = 'linear-gradient(135deg,#DC3545,#C0392B)';
      document.getElementById('res-emoji').textContent = '❌';
      document.getElementById('res-title').textContent = 'Неверно';
      document.getElementById('res-sub').textContent   = 'Стрик прерван · Завтра новый шанс';
    }

    document.getElementById('pts-earned').textContent  = ptsEarned > 0 ? '+' + ptsEarned : '0';
    document.getElementById('streak-after').textContent = state.streak + ' 🔥';
    document.getElementById('total-pts').textContent   = u.points || 0;

    if (!correct && !timeout) {
      const box = document.getElementById('correct-box');
      box.style.display = '';
      box.innerHTML = `<strong>✅ Правильный ответ:</strong><br>${q.options[q.correct]}`;
    }

    renderStreak(state.streak);
    startCountdown(['next-countdown']);
  }
}

// ── CONFETTI ──
function launchConfetti() {
  const cv = document.getElementById('confetti-canvas');
  cv.style.display = '';
  cv.width  = window.innerWidth;
  cv.height = window.innerHeight;
  const ctx = cv.getContext('2d');
  const colors = ['#FFD700','#EF3124','#28A745','#2196F3','#FF9800','#9C27B0','#fff'];
  const pieces = Array.from({length: 150}, () => ({
    x: Math.random() * cv.width, y: -10 - Math.random() * 60,
    w: Math.random() * 11 + 4,   h: Math.random() * 6 + 3,
    color: colors[Math.floor(Math.random() * colors.length)],
    vx: (Math.random() - .5) * 5, vy: Math.random() * 4.5 + 2,
    rot: Math.random() * 360,     vrot: (Math.random() - .5) * 7,
    alpha: 1
  }));
  let frame;
  function draw() {
    ctx.clearRect(0,0,cv.width,cv.height);
    let alive = false;
    pieces.forEach(p => {
      p.x += p.vx; p.y += p.vy * 1.04; p.rot += p.vrot;
      if (p.y > cv.height * .6) p.alpha = Math.max(0, p.alpha - .02);
      if (p.y < cv.height + 20) alive = true;
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });
    if (alive) { frame = requestAnimationFrame(draw); }
    else { cancelAnimationFrame(frame); cv.style.display = 'none'; }
  }
  draw();
  setTimeout(() => { cancelAnimationFrame(frame); cv.style.display = 'none'; }, 4500);
}
